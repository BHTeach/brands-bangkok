name: Build access guides
on:
  push:
    branches: [refresh-access-guide]
    paths:
      - 'access-guide.json'
      - 'venues.json'
      - 'build*.mjs'
      - 'scripts/**'
      - 'assets/style.css'
      - '.github/workflows/access-guides.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: access-guides-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install document dependencies
        run: |
          python -m pip install reportlab Pillow PyMuPDF fonttools
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation
      - name: Prepare credited photographs and fonts
        run: python scripts/prepare-print-assets.py
      - name: Generate website and print guides
        run: |
          node build.mjs
          python scripts/build-print-pdf.py
          python scripts/verify-print.py
      - name: Install browser checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check access map and site behaviour
        run: node scripts/verify-website.mjs
      - name: Save checked guides and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bangkok-access-map.svg assets/location-themes.css index.html about.html planning.html rental.html sources.html 404.html locations/ print-pack.html print-locations.html print-rental.html print/ preview/
          git diff --cached --quiet || git commit -m "Build checked station access guides and map [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
