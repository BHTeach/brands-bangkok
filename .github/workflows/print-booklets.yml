name: Build printed booklets
on:
  push:
    branches: [refresh-printed-guides]
    paths:
      - 'scripts/**'
      - 'build-print.mjs'
      - 'print/additional-photos.json'
      - 'venues.json'
      - 'exchange-rate.json'
      - 'assets/print.css'
      - '.github/workflows/print-booklets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: print-booklets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install print dependencies
        run: |
          python -m pip install reportlab Pillow PyMuPDF fonttools qrcode zxing-cpp
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation
      - name: Prepare credited photographs and fonts
        run: python scripts/prepare-print-assets.py
      - name: Generate booklets
        run: |
          node build-print.mjs
          python scripts/build-print-pdf.py
          python scripts/verify-print.py
      - name: Save generated print files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/website-qr.svg assets/*-shopping.jpg assets/centralworld-exterior.jpg assets/siam-paragon-facade.jpg print/ print-pack.html print-locations.html print-rental.html
          git diff --cached --quiet || git commit -m "Build revised print booklets and previews [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
